<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#D4A574" rx="16"/>
  
  <!-- Gift Box Body -->
  <rect x="20" y="35" width="60" height="50" fill="#E8D5C4" stroke="#8B6F47" stroke-width="2" rx="4"/>
  
  <!-- Gift Box Lid -->
  <rect x="20" y="25" width="60" height="15" fill="#C9B5A0" stroke="#8B6F47" stroke-width="2" rx="2"/>
  
  <!-- Ribbon Vertical -->
  <rect x="47" y="20" width="6" height="65" fill="#D4A574" stroke="#8B6F47" stroke-width="1"/>
  
  <!-- Ribbon Horizontal -->
  <rect x="15" y="42" width="70" height="6" fill="#D4A574" stroke="#8B6F47" stroke-width="1"/>
  
  <!-- Bow Top -->
  <circle cx="40" cy="38" r="6" fill="#E8D5C4" stroke="#8B6F47" stroke-width="1.5"/>
  <circle cx="60" cy="38" r="6" fill="#E8D5C4" stroke="#8B6F47" stroke-width="1.5"/>
  
  <!-- Bow Center -->
  <circle cx="50" cy="45" r="5" fill="#D4A574" stroke="#8B6F47" stroke-width="1.5"/>
  
  <!-- Decorative stars -->
  <path d="M50 8 L52 15 L59 16 L53 21 L55 28 L50 24 L45 28 L47 21 L41 16 L48 15 Z" fill="#FFD700" stroke="#8B6F47" stroke-width="0.5"/>
