<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="candleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#F5F5DC"/>
  <!-- Candle 1 -->
  <rect x="60" y="100" width="40" height="120" fill="#FFE5B4" stroke="#8B7355" stroke-width="2"/>
  <polygon points="60,100 100,100 95,85 65,85" fill="#FFD700"/>
  <ellipse cx="80" cy="85" rx="10" ry="8" fill="#FFA500" opacity="0.7"/>
  <!-- Candle 2 -->
  <rect x="130" y="120" width="40" height="100" fill="#FFDAB9" stroke="#8B7355" stroke-width="2"/>
  <polygon points="130,120 170,120 165,105 135,105" fill="#FFD700"/>
  <ellipse cx="150" cy="105" rx="10" ry="8" fill="#FFA500" opacity="0.7"/>
  <!-- Candle 3 -->
  <rect x="200" y="110" width="40" height="110" fill="#F0E68C" stroke="#8B7355" stroke-width="2"/>
  <polygon points="200,110 240,110 235,95 205,95" fill="#FFD700"/>
  <ellipse cx="220" cy="95" rx="10" ry="8" fill="#FFA500" opacity="0.7"/>
  <!-- Candle 4 -->
  <rect x="270" y="130" width="40" height="90" fill="#DEB887" stroke="#8B7355" stroke-width="2"/>
  <polygon points="270,130 310,130 305,115 275,115" fill="#FFD700"/>
  <ellipse cx="290" cy="115" rx="10" ry="8" fill="#FFA500" opacity="0.7"/>
  <!-- Text -->
  <text x="200" y="290" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Cozy Candle Set</text>
  <text x="200" y="320" font-size="16" text-anchor="middle" fill="#666">Premium Scented Candles</text>
</svg>
