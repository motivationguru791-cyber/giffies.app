<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GIFFIES — Cart</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <div class="nav-left">
          <a class="brand" href="/">GIFFIES</a>
          <a class="nav-link" href="/">Home</a>
        </div>
        <div class="nav-right">
          <span id="nav-user"></span>
          <a id="nav-login" class="nav-link" href="/login.html">Login</a>
          <a id="nav-register" class="nav-link" href="/register.html">Register</a>
          <a class="cart-link nav-link" href="/cart.html">Cart <span id="cart-count" class="badge">0</span></a>
        </div>
      </div>
    </nav>

    <main class="container">
      <h2>Your Cart</h2>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-summary">
        <div>Total: $<span id="cart-total">0.00</span></div>
      </div>

      <section class="checkout">
        <h3>Checkout</h3>
        <form id="checkout-form">
          <label>Name<input name="name" required></label>
          <label>Email<input name="email" type="email" required></label>
          <label>Address<textarea name="address" rows="3" required></textarea></label>
          <button type="submit" class="btn">Place Order</button>
        </form>
      </section>
    </main>

    <script src="/auth.js"></script>
    <script src="/cart.js"></script>
  </body>
</html>
